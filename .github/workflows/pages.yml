name: Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy specimen site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir site
          cp -r specimen site/specimen 2>/dev/null || true
          cp -r releases site/releases
          for f in index.html about.html try.html; do
            cp "$f" site/ 2>/dev/null || true
          done
          for f in favicon-32.png favicon-512.png favicon.ico apple-touch-icon.png; do
            cp "$f" site/ 2>/dev/null || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
